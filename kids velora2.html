        body {

        .product-card {
            background-color: #111111;
            border: 1px solid #444;
            border-radius: 0;
            transition: 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #d1b86c;
        }

        .product-img-wrapper {
            width: 100%;
            height: 260px;
            background-color: #1a1a1a;
            overflow: hidden;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .product-details {
            text-align: left;
        }

        html[dir="rtl"] .product-details {
            text-align: right;
        }

        .product-name {
            min-height: 40px;
        }

        .product-price {
            color: #ffffff;
            font-size: 1rem;

    <!-- ============================================

    <script>

        /* ============================================
           TRANSLATIONS

        const kidsTranslations = {

                remove: "Remove",

                addedSuccessfully:
                    "Added to Cart Successfully!",

                addedWishlist:
                    "Added to Wishlist Successfully!",

                copyright:
                    "All Rights Reserved © 2026 For Website",

                developedBy:
                    "Developed and Designed by 💻 ✨"

            },


            ar: {

                home: "الرئيسية",
                shop: "المتجر",
                women: "نساء",
                men: "رجال",
                kids: "أطفال",
                newArrivals: "وصل حديثًا",

                searchPlaceholder: "ابحث هنا...",

                login: "تسجيل الدخول",
                favourite: "المفضلة",
                cart: "السلة",

                kidsSection: "قسم الأطفال",

                kidsFashion:
                    "ملابس وأزياء الأطفال",

                addToCart:
                    "أضف إلى السلة",

                noProducts:
                    "لا توجد منتجات مطابقة لبحثك.",

                remove: "حذف",

                addedSuccessfully:
                    "تمت إضافة المنتج إلى السلة بنجاح!",

                addedWishlist:
                    "تمت إضافة المنتج إلى المفضلة بنجاح!",

                copyright:
                    "جميع الحقوق محفوظة © 2026 لموقع",

                developedBy:
                    "تم التطوير والتصميم بواسطة 💻 ✨"

            }

        };


        /* ============================================
           CURRENT LANGUAGE
           ============================================ */

        let currentLanguage =
            localStorage.getItem("veloraLanguage") || "en";


        /* ============================================
           PRODUCTS
           ============================================ */

        const kidsProducts = [

            {
                id: "kids-denim-2-piece",

                name: {
                    en: "Kids Denim 2-Piece Set - Boys",
                    ar: "طقم جينز قطعتين للأطفال - أولاد"
                },

                    "https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=600&q=80",

                price: "650 EGP",

                rating: 5
            },


            {
                id: "smile-floral-dress",

                name: {
                    en: "Smile Floral Sleeveless Dress - Girls",
                    ar: "فستان بناتي مشجر بدون أكمام"
                },

                image:
                    "https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=600&q=80",

                price: "420 EGP",

                category: "kids",

                rating: 5
            },


            {
                id: "casual-kids-set",

                name: {
                    en: "Casual Kids 2-Piece Set - Unisex",
                    ar: "طقم أطفال كاجوال قطعتين - للجنسين"
                },

                image:
                    "https://images.unsplash.com/photo-1503944583220-79d8926ad5e2?auto=format&fit=crop&w=600&q=80",

                price: "960 EGP",

                category: "kids",

                rating: 5
            },


            {
                id: "striped-kids-shirt",

                name: {
                    en: "Striped Kids T-Shirt - Unisex",
                    ar: "تيشيرت أطفال مخطط - للجنسين"
                },

                image:
                    "https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=600&q=80",

                price: "280 EGP",

                category: "kids",

                rating: 5
            },


            {
                id: "mini-gentleman-polo",

                name: {
                    en: "Mini Gentleman Polo T-Shirt - Boy",
                    ar: "تيشيرت بولو أنيق للأطفال - أولاد"
                },

                image:
                    "https://images.unsplash.com/photo-1471286174890-9c112ffca5b4?auto=format&fit=crop&w=600&q=80",

                price: "380 EGP",

                category: "kids",

                rating: 5
            },


            {
                id: "basic-cotton-kids-tee",

                name: {
                    en: "Basic Cotton Kids Tee - White - Unisex",
                    ar: "تيشيرت أطفال قطن أساسي - أبيض - للجنسين"
                },

                image:
                    "https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?auto=format&fit=crop&w=600&q=80",

                price: "350 EGP",

                category: "kids",

                rating: 5
            },


            {
                id: "sport-kids-tracksuit",

                name: {
                    en: "Sport Kids Tracksuit 2-Piece - Boys",
                    ar: "ترينينج رياضي للأطفال قطعتين - أولاد"
                },

                image:
                    "https://images.unsplash.com/photo-1596870230751-ebdfce98ec42?auto=format&fit=crop&w=600&q=80",

                price: "390 EGP",

                category: "kids",

                rating: 5
            }

        ];


        /* ============================================
           TRANSLATION HELPER
           ============================================ */

        function translate(key) {

            return kidsTranslations[currentLanguage][key] || key;

        }


        /* ============================================
           APPLY LANGUAGE
           ============================================ */

        function applyLanguage() {

            document.documentElement.lang =
                currentLanguage;

            document.documentElement.dir =
                currentLanguage === "ar"
                    ? "rtl"
                    : "ltr";


            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.dataset.i18n;

                    element.textContent =
                        translate(key);

                });


            document
                .querySelectorAll("[data-i18n-placeholder]")
                .forEach(element => {

                    const key =
                        element.dataset.i18nPlaceholder;

                    element.placeholder =
                        translate(key);

                });


            document
                .querySelectorAll("[data-i18n-title]")
                .forEach(element => {

                    const key =
                        element.dataset.i18nTitle;

                    element.title =
                        translate(key);

                });


            const languageToggle =
                document.getElementById(
                    "languageToggle"
                );


            if (languageToggle) {

                languageToggle.textContent =
                    currentLanguage === "en"
                        ? "العربية"
                        : "English";

            }


            localStorage.setItem(
                "veloraLanguage",
                currentLanguage
            );


            renderKidsProducts(
                kidsProducts
            );

        }


        /* ============================================
           LANGUAGE TOGGLE
           ============================================ */

        function setupLanguageToggle() {

            const languageToggle =
                document.getElementById(
                    "languageToggle"
                );


            if (!languageToggle) return;


            languageToggle.addEventListener(
                "click",
                () => {

                    currentLanguage =
                        currentLanguage === "en"
                            ? "ar"
                            : "en";


                    applyLanguage();

                }
            );

        }


        /* ============================================
           RATING STARS
           ============================================ */

        function createRating(rating) {

            let stars = "";


            for (
                let index = 0;
                index < rating;
                index++
            ) {

                stars +=
                    '<i class="bi bi-star-fill"></i>';

            }


            return stars;

        }


        /* ============================================
           RENDER PRODUCTS
           ============================================ */

        function renderKidsProducts(products) {

            const grid =
                document.getElementById(
                    "kids-products-grid"
                );


            if (!grid) return;


            grid.innerHTML = "";


            if (products.length === 0) {

                grid.innerHTML = `

                    <div
                        class="col-12 text-center text-muted py-5">

                        <i
                            class="bi bi-search fs-1 text-gold d-block mb-3">
                        </i>

                        <h5>
                            ${translate("noProducts")}
                        </h5>

                    </div>

                `;

                return;

            }


            products.forEach(product => {

                const productName =
                    product.name[currentLanguage];


                grid.innerHTML += `

                    <div class="col">

                        <div
                            class="product-card p-3 shadow-sm h-100 d-flex flex-column justify-content-between"
                            data-product-id="${product.id}">


                            <div>

                                <div
                                    class="product-img-wrapper mb-3">

                                    <img
                                        src="${product.image}"
                                        class="product-img"
                                        alt="${productName}"
                                        loading="lazy">

                                </div>


                                <div
                                    class="product-details text-white text-uppercase"
                                    style="font-size: 0.8rem;">


                                    <h6
                                        class="product-name fw-semibold mb-1 text-white">

                                        ${productName}

                                    </h6>


                                    <div
                                        class="rating mb-1 text-gold">

                                        ${createRating(product.rating)}

                                    </div>


                                    <p
                                        class="product-price fw-bold mb-2">

                                        ${product.price}

                                    </p>

                                </div>

                            </div>


                            <div
                                class="d-flex gap-2 mt-2">


                                <button
                                    class="btn btn-velora-gold w-75 rounded-0"
                                    type="button"
                                    onclick="addToCart('${product.id}')">

                                    ${translate("addToCart")}

                                </button>


                                <button
                                    class="btn btn-outline-warning w-25 rounded-0"
                                    type="button"
                                    style="border-color: #d1b86c; color: #d1b86c;"
                                    onclick="addToWishlist('${product.id}')"
                                    title="${translate("favourite")}">

                                    <i class="bi bi-heart"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });


            setupProductCards();

        }


        /* ============================================
           PRODUCT CARD CLICK
           ============================================ */

        function setupProductCards() {

            const productCards =
                document.querySelectorAll(
                    ".product-card"
                );


            productCards.forEach(card => {

                card.style.cursor = "pointer";


                card.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest("button")
                        ) {

                            return;

                        }


                        const productId =
                            card.dataset.productId;


                        const product =
                            kidsProducts.find(
                                item =>
                                    item.id === productId
                            );


                        if (!product) return;


                        const selectedProduct = {

                            id: product.id,

                            name: product.name,

                            nameTranslations:
                                product.name,

                            price: product.price,

                            image: product.image,

                            category: product.category,

                            rating: product.rating

                        };


                        localStorage.setItem(
                            "selectedProduct",
                            JSON.stringify(
                                selectedProduct
                            )
                        );


                        window.location.href =
                            "product-details velora2.html";

                    }
                );

            });

        }


        /* ============================================
           ADD TO CART
           ============================================ */

        function addToCart(productId) {

            const product =
                kidsProducts.find(
                    item =>
                        item.id === productId
                );


            if (!product) return;


            const cart =
                JSON.parse(
                    localStorage.getItem(
                        "veloraCart"
                    )
                ) || [];


            const existingItem =
                cart.find(
                    item =>
                        item.id === product.id
                );


            if (existingItem) {

                existingItem.quantity =
                    (Number(existingItem.quantity) || 0) + 1;

            } else {

                cart.push({

                    id: product.id,

                    name:
                        product.name.en,

                    nameTranslations:
                        product.name,

                    price:
                        product.price,

                    image:
                        product.image,

                    category:
                        product.category,

                    quantity: 1

                });

            }


            localStorage.setItem(
                "veloraCart",
                JSON.stringify(cart)
            );


            updateCartCount();


            alert(
                translate("addedSuccessfully")
            );

        }


        /* ============================================
           ADD TO WISHLIST
           ============================================ */

        function addToWishlist(productId) {

            const product =
                kidsProducts.find(
                    item =>
                        item.id === productId
                );


            if (!product) return;


            const wishlist =
                JSON.parse(
                    localStorage.getItem(
                        "veloraWishlist"
                    )
                ) || [];


            const exists =
                wishlist.some(
                    item =>
                        item.id === product.id
                );


            if (!exists) {

                wishlist.push({

                    id: product.id,

                    name:
                        product.name.en,

                    nameTranslations:
                        product.name,

                    price:
                        product.price,

                    image:
                        product.image,

                    category:
                        product.category

                });


                localStorage.setItem(
                    "veloraWishlist",
                    JSON.stringify(wishlist)
                );


                alert(
                    translate("addedWishlist")
                );

            }


            window.location.href =
                "wishlist velora2.html";

        }


        /* ============================================
           CART COUNT
           ============================================ */

        function updateCartCount() {

            const cart =
                JSON.parse(
                    localStorage.getItem(
                        "veloraCart"
                    )
                ) || [];


            const count =
                cart.reduce(
                    (total, item) =>
                        total +
                        (Number(item.quantity) || 0),
                    0
                );


            const badge =
                document.getElementById(
                    "cart-badge"
                );


            if (badge) {

                badge.textContent =
                    count;

            }

        }


        /* ============================================
           SEARCH
           ============================================ */

        function setupSearch() {

            const searchInput =
                document.getElementById(
                    "search-input"
                );


            if (!searchInput) return;


            searchInput.addEventListener(
                "input",
                event => {

                    const term =
                        event.target.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        kidsProducts.filter(
                            product => {

                                const englishName =
                                    product.name.en
                                        .toLowerCase();


                                const arabicName =
                                    product.name.ar
                                        .toLowerCase();


                                return (
                                    englishName.includes(term) ||
                                    arabicName.includes(term)
                                );

                            }
                        );


                    renderKidsProducts(
                        filtered
                    );

                }
            );

        }


        /* ============================================
           INITIALIZATION
           ============================================ */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                setupLanguageToggle();

                setupSearch();

                applyLanguage();

                updateCartCount();

            }
        );


        /* ============================================
           UPDATE WHEN LOCALSTORAGE CHANGES
           ============================================ */

        window.addEventListener(
            "storage",
            event => {

                if (
                    event.key === "veloraCart"
                ) {

                    updateCartCount();

                }


                if (
                    event.key === "veloraLanguage"
                ) {

                    currentLanguage =
                        event.newValue || "en";

                    applyLanguage();

                }

            }
        );

    </script>

</body>
